# ============================================================
#  P-POCR 配置文件 — PaddleOCR-VL PDF → Markdown 转换工具
# ============================================================
#  用法:
#    1. 直接修改本文件中的默认值
#    2. 或复制为 my_config.yaml 后通过 --config my_config.yaml 指定
#    3. 命令行参数优先级 > 配置文件 > 内置默认值
# ============================================================

# ---------- API 设置 ----------
api:
  # PaddleOCR API 地址
  job_url: "https://paddleocr.aistudio-app.com/api/v2/ocr/jobs"
  # API Token: 推荐通过环境变量 PADDLEOCR_API_TOKEN 注入, 或用 --token 参数传入
  token: "YOUR_AISTUDIO_TOKEN"
  # 识别模型
  model: "PaddleOCR-VL-1.6"

# ---------- 识别选项 ----------
options:
  # 是否启用文档方向分类
  use_doc_orientation_classify: false
  # 是否启用文档矫正
  use_doc_unwarping: false
  # 是否启用图表识别
  use_chart_recognition: false

# ---------- 输出设置 ----------
output:
  # 输出根目录 (每个 PDF 会在其下创建同名子目录)
  dir: "output"
  # 是否下载 markdown 中引用的图片
  download_md_images: true
  # 是否下载 outputImages (页面渲染图等)
  download_output_images: true

# ---------- 轮询设置 ----------
polling:
  # 轮询间隔 (秒)
  interval: 5
  # 最大等待时间 (秒), 0 表示无限等待
  timeout: 0

# ---------- 批处理设置 ----------
batch:
  # 是否递归扫描子目录中的 PDF
  recursive: false
  # 支持的文件扩展名
  extensions:
    - ".pdf"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".tiff"
    - ".bmp"

# ---------- 视频字幕 OCR 设置 (video_ocr.py) ----------
video:
  # 每秒抽帧数 (越高时间轴越准, 但调 API 越多)
  fps: 2
  # 裁取画面底部比例, 0.5 = 下半部分
  crop_bottom: 0.5
  # 字幕识别模型 (PP-OCRv5 纯文字识别, 快且省; PaddleOCR-VL-1.6 为文档解析)
  model: "PP-OCRv5"
  # 并发请求数
  workers: 4
  # 每批提交的任务数
  batch: 8
  # 轮询间隔 (秒)
  interval: 2
  # 单帧任务超时 (秒)
  timeout: 300
  # 文本置信度阈值 (低于此值的识别结果丢弃)
  min_score: 0.3
  # 是否做条带去重 (只在字幕区判断画面变化, 背景运动不影响)
  dedup: true
  # 去重检测条带高度: 画面底部比例
  dedup_strip: 0.15
  # 相邻字幕文本相似度 >= 此值时合并为一条 (0 关闭)
  merge_similarity: 0.7
  # 本地文字检测预筛: 检测不到文字的帧不调 API (需 rapidocr-onnxruntime)
  local_det: true
